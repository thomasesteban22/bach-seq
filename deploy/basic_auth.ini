# Configuracion de autenticacion de MLflow. Copiar a /home/ubuntu/mlflow-server/basic_auth.ini
# La contrasena inicial del admin se cambia apenas arranca el servidor (ver DEPLOY_AWS.md).
[mlflow]
default_permission = READ
database_uri = sqlite:///basic_auth.db
admin_username = admin
admin_password = password
authorization_function = mlflow.server.auth:authenticate_request_basic_auth
